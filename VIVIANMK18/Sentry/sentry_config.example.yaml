# VIVIAN Sentry System Configuration
# Copy this to sentry_config.yaml and fill in your credentials

# Email alerts
email:
  sender: ""
  app_password: ""
  recipient: ""
  smtp_server: "smtp.gmail.com"
  smtp_port: 587

# Discord webhook alerts
discord:
  webhook_url: ""

# Camera settings
camera:
  index: 0
  width: 1280
  height: 720
  fps: 30
  rotate_180: true
  brightness_mode: "adaptive"
  manual_brightness: 1.0

# Motion detection pre-filter
motion:
  enabled: true
  threshold: 25
  min_area: 5000
  blur_kernel: 21
  warmup_seconds: 10.0

# Person detection (YOLOv8)
detection:
  model: "yolov8n.pt"
  imgsz: 480
  confidence: 0.5
  iou_threshold: 0.45
  confirmation_frames: 3
  confirmation_min_hits: 3
  process_every_n_frames: 1
  min_person_height_ratio: 0.35
  deadzone_overlap_ratio: 0.5
  deadzones:
    - name: "left_window"
      region: [0, 0, 240, 720]
    - name: "rear_window"
      region: [480, 295, 1015, 455]
    - name: "right_window"
      region: [1040, 0, 1280, 720]

# Object tracking (ByteTrack)
tracking:
  high_thresh: 0.5
  low_thresh: 0.1
  buffer: 30
  alert_cooldown: 45.0
  unknown_cooldown: 90.0

# Face recognition (InsightFace)
face_recognition:
  database_path: "face_database"
  similarity_threshold: 0.4
  voting_frames: 5
  voting_majority: 3
  voting_timeout_frames: 15

# Face quality thresholds
face_quality:
  min_blur_score: 100.0
  min_brightness: 40.0
  max_brightness: 220.0
  min_face_size: 80
  max_face_angle: 30.0

# Known person behavior
known_person:
  cooldown_seconds: 300
  stop_system: false

# Snapshot management
snapshots:
  directory: "snapshots"
  known_retention_days: 30
  unknown_retention_days: 30

# Logging
logging:
  directory: "logs"
  max_bytes: 10485760
  backup_count: 5
  detection_log_max_bytes: 5242880
  detection_log_backup_count: 3

# AI Threat Analysis (Claude Vision)
threat_analysis:
  model: "claude-opus-4-8"   # vision model — opus 4.8 / sonnet 5 / haiku 4.5 (needs vision + structured outputs)
  enabled: true
  diagnostic_mode: false
  anthropic_api_key: ""
  # Describe your camera's vantage point so the model places occupants correctly
  # (front/rear, driver/passenger). Leave empty to skip. Example:
  camera_perspective: >-
    The camera faces the cabin. Describe where it is mounted, which way it faces,
    which side of the frame is the driver's seat, and where the front vs rear
    seats appear, so seat positions and proximity to the controls are accurate.

# Tamper detection
tamper_detection:
  cooldown_seconds: 300
  obstruction_variance_threshold: 5.0
  obstruction_consecutive_seconds: 5.0
  obstruction_check_interval: 15

# Video recording on detection events
recording:
  directory: "recordings"
  duration_seconds: 30.0
  fps: 6.0
  codec: "MJPG"
  max_files: 35
  enabled: true

# Camera watchdog
watchdog:
  timeout: 5.0
  max_retries: 3
  retry_delay: 2.0
  backoff_multiplier: 2.0
