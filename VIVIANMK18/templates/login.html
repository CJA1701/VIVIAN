<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVIAN Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 40px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        @media (max-width: 480px) {
            .login-container { padding: 28px 22px; }
            .logo { font-size: 28px; letter-spacing: 5px; }
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 32px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00ff88;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            border: none;
            border-radius: 4px;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
        }
        button:hover { background: #00cc6e; }
        .error {
            color: #ff4444;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">VIVIAN</div>
        <div class="subtitle">1969 Ford Mustang &mdash; Remote Dashboard</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" autofocus required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">AUTHENTICATE</button>
        </form>
    </div>
</body>
</html>
